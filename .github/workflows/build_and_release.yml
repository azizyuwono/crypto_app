name: Build and Release App

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0' # Use a specific version or remove for latest

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifact (arm64)
        uses: actions/upload-artifact@v3
        with:
          name: app-release-arm64-v8a.apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload APK Artifact (universal)
        uses: actions/upload-artifact@v3
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS (No Code Signing)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (Release - No Codesign)
        # Building for simulator is easier without signing identities
        # Or build --no-codesign for physical device payload
        run: flutter build ios --release --no-codesign

      - name: Compress Payload
        run: |
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r simple_crypto_ios.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: simple_crypto_ios.ipa
          path: simple_crypto_ios.ipa

  release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Download Android Artifacts
        uses: actions/download-artifact@v3
        with:
          name: app-release.apk

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v3
        with:
          name: simple_crypto_ios.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            app-release.apk
            simple_crypto_ios.ipa
          draft: false
          prerelease: false
